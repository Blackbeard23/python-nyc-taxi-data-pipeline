name: CI

on:
  push:
    branches: development # matches any branch
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Run flake8 (linting)
      - name: Run flake8
        run: flake8

      # Run pytest (unit tests)
      - name: Run pytest
        run: pytest
